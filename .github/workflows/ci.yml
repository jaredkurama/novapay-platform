name: NovaPay CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  quality:
    name: Lint, tests and C# SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Restore locked dependencies
        run: dotnet restore NovaPay.slnx --locked-mode
      - name: Lint C# formatting
        run: dotnet format NovaPay.slnx --no-restore --verify-no-changes
      - name: Unit and API tests
        run: dotnet test NovaPay.slnx --configuration Release --no-restore --logger trx --results-directory artifacts/tests
      - name: C# security static analysis
        run: python3 scripts/security_scan.py sast src/NovaPay.Api/NovaPay.Api.csproj
      - name: Prove insecure code fails SAST
        run: python3 scripts/verify_security_gates.py sast
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: artifacts/tests/
          retention-days: 14

  security:
    name: Secrets and dependency vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified scanners
        run: python3 scripts/install_security_tools.py gitleaks trivy actionlint
      - name: Validate workflow syntax
        run: .tools/security/actionlint -color
      - name: Prove removed secrets fail the gate
        run: python3 scripts/verify_security_gates.py secrets
      - name: Scan complete fetched Git history for secrets
        run: python3 scripts/security_scan.py secrets . --report artifacts/secrets.json
      - name: Prove critical vulnerabilities fail the gate
        run: python3 scripts/verify_security_gates.py vulnerabilities
      - name: Scan NuGet dependencies including transitive and test packages
        run: python3 scripts/security_scan.py dependencies . --report artifacts/dependencies.json
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-reports
          path: artifacts/*.json
          retention-days: 14

  container:
    name: Build, scan and verify container
    needs: [quality, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      IMAGE: novapay-wallet:${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install checksum-verified Trivy
        run: python3 scripts/install_security_tools.py trivy
      - name: Build multi-stage image
        run: docker build --pull --tag "$IMAGE" .
      - name: Block high and critical image vulnerabilities
        run: python3 scripts/security_scan.py image "$IMAGE" --report artifacts/container-scan.json
      - name: Verify actual non-root process, runtime restrictions and endpoints
        run: python3 scripts/verify_container.py "$IMAGE" | tee artifacts/container-verification.json
      - name: Upload container evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-evidence
          path: artifacts/*.json
          retention-days: 14

  ci-pass:
    name: CI passed
    if: always()
    needs: [quality, security, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every gate to succeed
        env:
          QUALITY: ${{ needs.quality.result }}
          SECURITY: ${{ needs.security.result }}
          CONTAINER: ${{ needs.container.result }}
        run: |
          test "$QUALITY" = success
          test "$SECURITY" = success
          test "$CONTAINER" = success
