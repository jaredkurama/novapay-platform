name: NovaPay CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  quality:
    name: Lint, tests and C# SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore locked dependencies
        run: dotnet restore NovaPay.slnx --locked-mode
      - name: Lint C# formatting
        run: dotnet format NovaPay.slnx --no-restore --verify-no-changes
      - name: Unit and API tests
        run: dotnet test NovaPay.slnx --configuration Release --no-restore --logger trx --results-directory artifacts/tests
      - name: C# security static analysis
        run: |
          dotnet build NovaPay.slnx \
            --configuration Release --no-restore --no-incremental \
            -p:EnableNETAnalyzers=true \
            -p:AnalysisModeSecurity=All \
            -p:RunAnalyzersDuringBuild=true \
            -p:TreatWarningsAsErrors=true
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: artifacts/tests/
          retention-days: 14

  security:
    name: Secrets and dependency vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create report directory
        run: mkdir -p artifacts
      - name: Scan complete fetched Git history for secrets
        id: gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: >-
            git /github/workspace --log-opts=--all --redact=100 --exit-code=1
            --report-format=json --report-path=/github/workspace/artifacts/secrets.json
      - name: Summarize secret scan
        if: always() && steps.gitleaks.outcome != 'skipped'
        env:
          SCAN_OUTCOME: ${{ steps.gitleaks.outcome }}
        run: |
          {
            echo '## Gitleaks Secret Scan'
            echo "**Step result:** $SCAN_OUTCOME"
            echo '**Scope:** All fetched Git history, including removed files.'
            if [ -f artifacts/secrets.json ]; then
              finding_count=$(jq 'length' artifacts/secrets.json)
              echo "**Findings:** $finding_count"
            fi
            if [ "$SCAN_OUTCOME" != success ]; then
              echo 'The scan failed. Review the redacted artifact and logs; a missing report is not a clean scan.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.76.0
      - name: Scan NuGet dependencies including transitive and test packages
        id: trivy
        run: |
          trivy fs . \
            --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            --skip-dirs .tools --skip-dirs artifacts \
            --skip-dirs '**/bin' --skip-dirs '**/obj' \
            --format table --timeout 10m \
            > artifacts/dependencies.txt 2> artifacts/dependencies-stderr.txt
      - name: Summarize dependency scan
        if: always() && steps.trivy.outcome != 'skipped'
        env:
          SCAN_OUTCOME: ${{ steps.trivy.outcome }}
        run: |
          if [ -f artifacts/dependencies-stderr.txt ]; then
            cat artifacts/dependencies-stderr.txt >&2
          fi
          {
            echo '## Trivy Dependency Scan'
            echo "**Step result:** $SCAN_OUTCOME"
            if [ -f artifacts/dependencies.txt ]; then
              finding_count=$(awk '/^[[:space:]]*Total: [0-9]+/ {sum += $2} END {print sum+0}' artifacts/dependencies.txt)
              echo "**HIGH/CRITICAL findings across all targets:** $finding_count"
              echo '<details><summary>Scan report</summary>'
              echo
              echo '```text'
              cat artifacts/dependencies.txt
              echo '```'
              echo '</details>'
            fi
            if [ "$SCAN_OUTCOME" != success ]; then
              echo 'The scan failed. A zero count does not mean the scan completed successfully; check the logs.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-reports
          path: artifacts/
          retention-days: 14

  container:
    name: Build, scan and verify container
    needs: [quality, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: novapay-wallet:${{ github.sha }}
      AWS_REGION: eu-west-1
      STAGING_INSTANCE_ID: i-0f497102e8d5a3051
      DEPLOY_DOCUMENT: novapay-staging-deploy
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build multi-stage image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ env.IMAGE }}
          pull: true
          load: true
          push: false

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.76.0

      - name: Create report directory
        run: mkdir -p artifacts
      - name: Block high and critical image vulnerabilities
        id: trivy
        run: |
          trivy image "$IMAGE" \
            --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            --format table --timeout 10m \
            > artifacts/container-scan.txt 2> artifacts/container-stderr.txt
      - name: Summarize image scan
        if: always() && steps.trivy.outcome != 'skipped'
        env:
          SCAN_OUTCOME: ${{ steps.trivy.outcome }}
        run: |
          if [ -f artifacts/container-stderr.txt ]; then
            cat artifacts/container-stderr.txt >&2
          fi
          {
            echo '## Trivy Image Scan'
            printf '**Image:** `%s`\n' "$IMAGE"
            echo "**Step result:** $SCAN_OUTCOME"
            if [ -f artifacts/container-scan.txt ]; then
              finding_count=$(awk '/^[[:space:]]*Total: [0-9]+/ {sum += $2} END {print sum+0}' artifacts/container-scan.txt)
              echo "**HIGH/CRITICAL findings across all targets:** $finding_count"
              echo '<details><summary>Scan report</summary>'
              echo
              echo '```text'
              cat artifacts/container-scan.txt
              echo '```'
              echo '</details>'
            fi
            if [ "$SCAN_OUTCOME" != success ]; then
              echo 'The scan failed. A zero count does not mean the scan completed successfully; check the logs.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify actual non-root process, runtime restrictions and endpoints
        run: python3 scripts/verify_container.py "$IMAGE" | tee artifacts/container-verification.json
      - name: Test deployment readiness and rollback paths without AWS access
        run: python3 scripts/test_deployment.py
      - name: Obtain temporary AWS credentials through GitHub OIDC
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::008971632699:role/novapay-staging-github-deployment
          role-session-name: novapay-${{ github.run_id }}
          allowed-account-ids: "008971632699"
      - name: Log in to private ECR
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Publish the scanned image and resolve its immutable digest
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: publish
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          tag="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          repository="$REGISTRY/novapay-wallet"
          docker tag "$IMAGE" "$repository:$tag"
          docker push "$repository:$tag"
          digest=$(aws ecr describe-images --repository-name novapay-wallet \
            --image-ids "imageTag=$tag" --query 'imageDetails[0].imageDigest' --output text)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker inspect "$repository:$tag" --format '{{json .RepoDigests}}' |
            jq -e --arg expected "$repository@$digest" 'index($expected) != null' >/dev/null
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf '## Published image\n`%s@%s`\n' "$repository" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy the digest through the restricted SSM document
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: deploy
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$STAGING_INSTANCE_ID" \
            --document-name "$DEPLOY_DOCUMENT" \
            --parameters "ImageDigest=$IMAGE_DIGEST,AppVersion=$GITHUB_SHA" \
            --timeout-seconds 120 \
            --comment "NovaPay deployment $GITHUB_SHA" \
            --query 'Command.CommandId' --output text)
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
      - name: Wait for readiness or rollback and report the deployment result
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          for attempt in $(seq 1 180); do
            if aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "$STAGING_INSTANCE_ID" > artifacts/deployment.json 2> artifacts/deployment-stderr.txt; then
              status=$(jq -r '.Status' artifacts/deployment.json)
              case "$status" in
                Success)
                  jq -r '.StandardOutputContent' artifacts/deployment.json
                  printf '## Staging deployment\nReadiness passed for `%s`.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
                  exit 0 ;;
                Pending|InProgress|Delayed) ;;
                *)
                  jq -r '.StandardOutputContent, .StandardErrorContent' artifacts/deployment.json
                  printf '## Staging deployment\nFailed: %s. Review rollback output in the deployment artifact.\n' "$status" >> "$GITHUB_STEP_SUMMARY"
                  exit 1 ;;
              esac
            elif ! grep -q InvocationDoesNotExist artifacts/deployment-stderr.txt; then
              cat artifacts/deployment-stderr.txt >&2
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for SSM command $COMMAND_ID; inspect its status before retrying." >&2
          exit 1
      - name: Upload container evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-evidence
          path: artifacts/
          retention-days: 14

  ci-pass:
    name: CI passed
    if: always()
    needs: [quality, security, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every gate to succeed
        env:
          QUALITY: ${{ needs.quality.result }}
          SECURITY: ${{ needs.security.result }}
          CONTAINER: ${{ needs.container.result }}
        run: |
          test "$QUALITY" = success
          test "$SECURITY" = success
          test "$CONTAINER" = success
